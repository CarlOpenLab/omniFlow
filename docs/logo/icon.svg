<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3FA1F9"/>
      <stop offset="0.52" stop-color="#1865EE"/>
      <stop offset="1" stop-color="#4237C6"/>
    </linearGradient>
    <radialGradient id="lift" cx="0.34" cy="0.22" r="0.72">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.26"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pipe" x1="0.05" y1="0" x2="0.92" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.38" stop-color="#FBFAF8"/>
      <stop offset="0.72" stop-color="#E8EDF5"/>
      <stop offset="1" stop-color="#C9D5E6"/>
    </linearGradient>
    <linearGradient id="rim" x1="0.15" y1="0.05" x2="0.9" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#EEF2F8"/>
      <stop offset="1" stop-color="#C9D6E7"/>
    </linearGradient>
    <linearGradient id="glass" x1="0.18" y1="0.08" x2="0.85" y2="1">
      <stop offset="0" stop-color="#34415A"/>
      <stop offset="0.5" stop-color="#1C212C"/>
      <stop offset="1" stop-color="#0B111C"/>
    </linearGradient>
    <radialGradient id="dot" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#FFF6C2"/>
      <stop offset="0.55" stop-color="#FDDA34"/>
      <stop offset="1" stop-color="#EFB51B"/>
    </radialGradient>
    <radialGradient id="spec" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <filter id="softsmall" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <clipPath id="tileClip">
      <rect x="40" y="40" width="944" height="944" rx="210"/>
    </clipPath>
    <clipPath id="glassClip">
      <circle cx="507" cy="512" r="158"/>
    </clipPath>
  </defs>

  <g clip-path="url(#tileClip)">
    <rect x="40" y="40" width="944" height="944" fill="url(#bg)"/>
    <rect x="40" y="40" width="944" height="944" fill="url(#lift)"/>

    <g filter="url(#soft)" opacity="0.24">
      <path d="M -240 640 C 380 640, 632 384, 1264 384" fill="none" stroke="#0A2A6B" stroke-width="200" transform="translate(10 20)"/>
      <circle cx="507" cy="512" r="200" fill="#0A2A6B" transform="translate(10 20)"/>
    </g>

    <path d="M -240 640 C 380 640, 632 384, 1264 384" fill="none" stroke="url(#pipe)" stroke-width="200"/>

    <circle cx="513" cy="526" r="204" fill="#6E88AC" opacity="0.26" filter="url(#softsmall)"/>
    <circle cx="507" cy="512" r="200" fill="url(#rim)"/>
    <circle cx="507" cy="512" r="176" fill="#BCCBE0"/>
    <circle cx="507" cy="512" r="158" fill="url(#glass)"/>
    <g clip-path="url(#glassClip)">
      <ellipse cx="421" cy="415" rx="102" ry="60" fill="url(#spec)" transform="rotate(-32 421 415)"/>
    </g>
    <circle cx="487" cy="492" r="52" fill="url(#dot)"/>
    <circle cx="468" cy="473" r="15" fill="#FFF9DB" opacity="0.9"/>
  </g>
